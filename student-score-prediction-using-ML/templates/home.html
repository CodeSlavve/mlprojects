<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Student Performance Prediction</title>
   <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body class="form-page">
   <div class="app-card">
       <div class="form-header">
           <h1>Student Exam Performance Indicator</h1>
           <p>Complete the student profile below to estimate the likely maths score.</p>
       </div>

       <form action="{{ url_for('predict_datapoint') }}" method="post">
           <div class="form-grid">
               <div class="field">
                   <label for="gender">Gender</label>
                   <select id="gender" name="gender" required>
                       <option selected disabled value="">Select your Gender</option>
                       <option value="male">Male</option>
                       <option value="female">Female</option>
                   </select>
               </div>

               <div class="field">
                   <label for="ethnicity">Race or Ethnicity</label>
                   <select id="ethnicity" name="ethnicity" required>
                       <option selected disabled value="">Select Ethnicity</option>
                       <option value="group A">Group A</option>
                       <option value="group B">Group B</option>
                       <option value="group C">Group C</option>
                       <option value="group D">Group D</option>
                       <option value="group E">Group E</option>
                   </select>
               </div>

               <div class="field">
                   <label for="parental_level_of_education">Parental Level of Education</label>
                   <select id="parental_level_of_education" name="parental_level_of_education" required>
                       <option selected disabled value="">Select Parent Education</option>
                       <option value="associate's degree">Associate's degree</option>
                       <option value="bachelor's degree">Bachelor's degree</option>
                       <option value="high school">High school</option>
                       <option value="master's degree">Master's degree</option>
                       <option value="some college">Some college</option>
                       <option value="some high school">Some high school</option>
                   </select>
               </div>

               <div class="field">
                   <label for="lunch">Lunch Type</label>
                   <select id="lunch" name="lunch" required>
                       <option selected disabled value="">Select Lunch Type</option>
                       <option value="free/reduced">Free/Reduced</option>
                       <option value="standard">Standard</option>
                   </select>
               </div>

               <div class="field">
                   <label for="test_preparation_course">Test Preparation Course</label>
                   <select id="test_preparation_course" name="test_preparation_course" required>
                       <option selected disabled value="">Select Test Course</option>
                       <option value="none">None</option>
                       <option value="completed">Completed</option>
                   </select>
               </div>

               <div class="field">
                   <label for="reading_score">Reading Score out of 100</label>
                   <input id="reading_score" type="number" name="reading_score" placeholder="Enter reading score" min="0" max="100" required />
               </div>

               <div class="field">
                   <label for="writing_score">Writing Score out of 100</label>
                   <input id="writing_score" type="number" name="writing_score" placeholder="Enter writing score" min="0" max="100" required />
               </div>
           </div>

           <div class="form-actions">
               <button class="primary-btn" type="submit">Predict maths score</button>
               <button class="secondary-btn" type="reset">Reset</button>
           </div>
       </form>

       {% if results is not none %}
       <div class="result-card">
           <h2>Prediction</h2>
           <p class="result-score">{{ results }}</p>
           <p class="result-caption">Estimated maths score out of 100</p>
       </div>
       {% endif %}
   </div>
</body>
</html>
